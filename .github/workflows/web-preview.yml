name: Web application smoke
on:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'pnpm-lock.yaml', 'tests/web_smoke.py', '.github/workflows/web-preview.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm export:web
      - name: Browser testing tools
        run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Exercise actual browser build
        run: python3 tests/web_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screenshots-and-results
          path: artifacts/web/
          if-no-files-found: error
